# Runs the robust re-analysis pipeline end to end and checks a curated set of
# key numbers against 01_code/R/tests/expected_key_numbers.csv (task T30).
# About 15 minutes: package install from the Posit binary mirror, then the
# pipeline (2,000 surrogates, about 5 minutes). Package versions follow
# DESCRIPTION (Imports only); renv.lock records the exact versions used for the
# committed outputs.
name: pipeline

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['manuscript/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['manuscript/**', 'docs/**', '**/*.md']
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R_KEEP_PKG_SOURCE: no
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          cache-version: 1

      - name: Run the pipeline (2,000 surrogates)
        run: ./run_pipeline.sh

      - name: Check key numbers against the expected values
        run: Rscript 01_code/R/tests/check_outputs.R

      - name: Report which committed tables changed (information only)
        if: always()
        run: |
          git status --short 02_data/derived 03_analyses/robust-reanalysis/tables | head -60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robust-reanalysis-outputs
          path: |
            03_analyses/robust-reanalysis/tables
            03_analyses/robust-reanalysis/report.md
            03_analyses/robust-reanalysis/run_info.txt
            03_analyses/robust-reanalysis/run_log.txt
          retention-days: 30
